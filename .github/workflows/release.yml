---
name: Publish Release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11 (for Chaquopy build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore (Optional)
        id: keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d \
              > "$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" \
              >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APKs
        run: ./gradlew assembleArm64Release assembleArm32Release assembleX86Release assembleX86_64Release assembleUniversalRelease --stacktrace
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Artifacts & Checksums
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          fi

          mkdir -p release-artifacts
          CONFIGS=(
            "arm64:arm64-v8a"
            "arm32:armeabi-v7a"
            "universal:universal"
            "x86:x86"
            "x86_64:x86_64"
          )

          for item in "${CONFIGS[@]}"; do
            FLAVOR="${item%%:*}"
            ARCH="${item##*:}"
            APK_SRC="$(find "app/build/outputs/apk/${FLAVOR}" -name "*.apk" -type f | head -n 1)"
            if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
              echo "Error: No APK found for ${FLAVOR}"
              find app/build/outputs -type f
              exit 1
            fi
            cp "$APK_SRC" "release-artifacts/REX-Ytdlp-${ARCH}-${TAG_NAME}.apk"
          done

          sha256sum release-artifacts/*.apk > release-artifacts/SHA256SUMS
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          if [ -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            rm "$GITHUB_WORKSPACE/release.keystore"
          fi

      - name: Upload Artifacts to Workflow Run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-apks-${{ env.TAG_NAME }}
          path: release-artifacts/
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: REX Ytdlp ${{ env.TAG_NAME }}
          body: |
            ### Checksums

            | File | SHA-256 |
            | :--- | :--- |
            | `REX-Ytdlp-arm64-v8a-${{ env.TAG_NAME }}.apk` | See `SHA256SUMS` |
            | `REX-Ytdlp-armeabi-v7a-${{ env.TAG_NAME }}.apk` | See `SHA256SUMS` |
            | `REX-Ytdlp-universal-${{ env.TAG_NAME }}.apk` | See `SHA256SUMS` |
            | `REX-Ytdlp-x86-${{ env.TAG_NAME }}.apk` | See `SHA256SUMS` |
            | `REX-Ytdlp-x86_64-${{ env.TAG_NAME }}.apk` | See `SHA256SUMS` |
          files: |
            release-artifacts/REX-Ytdlp-arm64-v8a-${{ env.TAG_NAME }}.apk
            release-artifacts/REX-Ytdlp-armeabi-v7a-${{ env.TAG_NAME }}.apk
            release-artifacts/REX-Ytdlp-universal-${{ env.TAG_NAME }}.apk
            release-artifacts/REX-Ytdlp-x86-${{ env.TAG_NAME }}.apk
            release-artifacts/REX-Ytdlp-x86_64-${{ env.TAG_NAME }}.apk
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
